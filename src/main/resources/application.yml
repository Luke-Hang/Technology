#    port: 6379
#    password: 123
#    expirationTime: 3600
#      nodes: 192.168.126.129:7000
#      max-redirects:

#Redis集群
  jedis:
    cluster:
      nodes: 192.168.126.129:7000,192.168.126.129:7001,192.168.126.129:7002,192.168.126.129:7003,192.168.126.129:7004
    password: 123
    expirationTime: 30000
    renewalTime: 5000
    pool:
      max-active: 200
      # 连接池最大阻塞等待时间（使用负值表示没有限制）
      max-wait: -1
      max-idle: 10
      min-idle: 0
      timeout: 1000
      ex: 3600
      #限制单个文件夹大小最大为5MB
      max-file-size: 5242800

  rabbitmq:
    host: localhost
    port: 15672
    username: guest
    password: guest
    publisher-confirm-type: correlated

  thymeleaf:
    prefix: classpath:/templates/jsp/
    suffix: .jsp


server:
  port: 8080

app:
  name: customer-service
  timeout: 5000
  retry: 3





